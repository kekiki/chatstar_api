app = "chatstar-api"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
GOOGLE_SERVICE_ACCOUNT_FILE = "/app/secrets/google-play-service-account.json"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[vm]
size = "shared-cpu-1x"

[[files]]
guest_path = "/app/secrets/google-play-service-account.json"
secret_name = "GOOGLE_PLAY_SERVICE_ACCOUNT_B64"